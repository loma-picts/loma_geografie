    // ------------------------------------------------------------
    // 9. Resize & VisualViewport für iPadOS-Tastatur
    // ------------------------------------------------------------
    function handleResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.setSize(w, h, false);
    }

    window.addEventListener('resize', handleResize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', handleResize);
    }

    // ------------------------------------------------------------
    // 10. Projektion der 3D-Labels & Haupt-Renderloop (60 fps)
    // ------------------------------------------------------------
    const _projVec = new THREE.Vector3();
    const _camUnit = new THREE.Vector3();
    const _worldVec = new THREE.Vector3();
    const _surfaceVec = new THREE.Vector3();
    const _earthWorldQuat = new THREE.Quaternion();
    const _invTiltQuat = new THREE.Quaternion();
    const _camInTilt = new THREE.Vector3();
    const _poleVec = new THREE.Vector3();

    function projectToScreen(vec3, width, height) {
      _projVec.copy(vec3).project(camera);
      if (_projVec.z > 1) return null;
      return {
        x: (_projVec.x * 0.5 + 0.5) * width,
        y: (-_projVec.y * 0.5 + 0.5) * height,
      };
    }

    function updateProjectedOverlays() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      _camUnit.copy(camera.position).normalize();
      const horizonCos = 1.0 / camDist;
      earthGroup.getWorldQuaternion(_earthWorldQuat);

      // Präzise Oberflächen-Marker (R = 1.001, Null Parallaxe)
      for (const pin of activePins) {
        _worldVec.copy(pin.localNormal).applyQuaternion(_earthWorldQuat);
        const frontDot = _worldVec.dot(_camUnit);
        if (frontDot < horizonCos - 0.012) {
          pin.markerEl.style.opacity = '0';
          pin.pointEl.style.pointerEvents = 'none';
          pin.labelEl.style.pointerEvents = 'none';
          continue;
        }

        _surfaceVec.copy(_worldVec).multiplyScalar(1.001);
        const pt = projectToScreen(_surfaceVec, w, h);
        if (!pt) {
          pin.markerEl.style.opacity = '0';
          pin.pointEl.style.pointerEvents = 'none';
          pin.labelEl.style.pointerEvents = 'none';
          continue;
        }

        const alpha =
          frontDot < horizonCos + 0.045
            ? clamp((frontDot - (horizonCos - 0.012)) / 0.057, 0, 1)
            : 1;
        pin.markerEl.style.opacity = String(alpha);
        pin.pointEl.style.pointerEvents = 'auto';
        pin.labelEl.style.pointerEvents = 'auto';
        pin.markerEl.style.transform = `translate3d(${pt.x.toFixed(1)}px, ${pt.y.toFixed(1)}px, 0)`;
      }

      // Breitenkreis-Labels (vordere Länge im geneigten Erd-Koordinatensystem)
      _invTiltQuat.copy(earthTiltGroup.quaternion).invert();
      _camInTilt.copy(_camUnit).applyQuaternion(_invTiltQuat);
      const camTiltLon = vec3ToLatLon(_camInTilt).lon;

      for (const item of lineLabels) {
        if (!linesGroup.visible) {
          item.el.style.opacity = '0';
          continue;
        }
        const pos = latLonToVec3(item.lat, camTiltLon, 1.004).applyQuaternion(earthTiltGroup.quaternion);
        const dot = pos.clone().normalize().dot(_camUnit);
        if (dot < horizonCos + 0.08) {
          item.el.style.opacity = '0';
          continue;
        }
        const pt = projectToScreen(pos, w, h);
        if (!pt) {
          item.el.style.opacity = '0';
          continue;
        }
        item.el.style.opacity = '0.92';
        item.el.style.transform = `translate3d(${(pt.x - 20).toFixed(1)}px, ${(pt.y - 10).toFixed(1)}px, 0)`;
      }

      // Nord-/Südpol-Badges & 23.5°-Neigungswinkel-Badge auf der Achse
      if (axisVisible) {
        _poleVec.set(0, 1.31, 0).applyQuaternion(earthTiltGroup.quaternion);
        const nPt = projectToScreen(_poleVec, w, h);
        _poleVec.set(0, -1.31, 0).applyQuaternion(earthTiltGroup.quaternion);
        const sPt = projectToScreen(_poleVec, w, h);

        const midAngle = (currentSun.obliqCorr * RAD) * 0.5;
        _poleVec.set(Math.sin(midAngle) * 1.24, Math.cos(midAngle) * 1.24, 0);
        const tiltPt = projectToScreen(_poleVec, w, h);
        _poleVec.set(0, 1.24, 0);
        const vertPt = projectToScreen(_poleVec, w, h);

        if (nPt) {
          northPoleBadge.style.opacity = '1';
          northPoleBadge.style.transform = `translate3d(${(nPt.x - 12).toFixed(1)}px, ${(nPt.y - 12).toFixed(1)}px, 0)`;
        } else {
          northPoleBadge.style.opacity = '0';
        }
        if (sPt) {
          southPoleBadge.style.opacity = '1';
          southPoleBadge.style.transform = `translate3d(${(sPt.x - 12).toFixed(1)}px, ${(sPt.y - 12).toFixed(1)}px, 0)`;
        } else {
          southPoleBadge.style.opacity = '0';
        }
        if (tiltPt) {
          let tx = tiltPt.x;
          let ty = tiltPt.y;
          // Bei starker perspektivischer Verkürzung (z. B. 21. Mär / 23. Sep) Abstand zum N-Badge sichern
          if (nPt && Math.hypot(tx - nPt.x, ty - nPt.y) < 48) {
            const awaySign = vertPt && nPt.x >= vertPt.x ? -1 : 1;
            tx = (vertPt ? vertPt.x : tx) + awaySign * 30;
          }
          tiltBadge.style.opacity = '1';
          tiltBadge.style.transform = `translate3d(${tx.toFixed(1)}px, ${ty.toFixed(1)}px, 0) translate(-50%, -50%)`;
        } else {
          tiltBadge.style.opacity = '0';
        }
      } else {
        northPoleBadge.style.opacity = '0';
        southPoleBadge.style.opacity = '0';
        tiltBadge.style.opacity = '0';
      }
    }

    // Initiale Sonnenberechnung: Seitenansicht auf Tag-/Nachtgrenze & 23.5°-Achsenneigung
    updateTimeReadoutAndSun('init');
    camWorldLon = wrapLon(currentSunWorldLon - 75);

    let lastFrameTime = performance.now();

    function animate(nowMs) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (nowMs - lastFrameTime) / 1000);
      lastFrameTime = nowMs;

      // Sanfter Übergang beim Klick auf Jahreszeiten-Buttons (21. Mär / 21. Jun / 23. Sep / 21. Dez)
      if (dateAnim) {
        const tRaw = clamp((nowMs - dateAnim.startTime) / dateAnim.duration, 0, 1);
        const t = tRaw < 0.5 ? 4 * tRaw * tRaw * tRaw : 1 - Math.pow(-2 * tRaw + 2, 3) / 2;
        dateAnim.currentDay = dateAnim.startDay + dateAnim.deltaDays * t;
        if (dateAnim.targetMezMinutes !== null) {
          simMezMinutes = dateAnim.startMezMinutes + (dateAnim.targetMezMinutes - dateAnim.startMezMinutes) * t;
        }
        if (tRaw >= 1) {
          simDayOfYear = dateAnim.targetDay;
          if (dateAnim.targetMezMinutes !== null) {
            simMezMinutes = dateAnim.targetMezMinutes;
          }
          dateAnim = null;
          updateTimeReadoutAndSun('date');
        } else {
          updateTimeReadoutAndSun('date', dateAnim.currentDay);
        }
      }

      // Zeitraffer: 90 simulierte Minuten pro Sekunde (24h in 16s)
      if (isPlaying) {
        simMezMinutes += dt * 90;
        if (simMezMinutes >= 1440) {
          simMezMinutes -= 1440;
          simDayOfYear += 1;
          if (simDayOfYear > daysInYear(simYear)) {
            simDayOfYear = 1;
            simYear += 1;
          }
        }
        updateTimeReadoutAndSun('time');
      }

      // Fly-To oder Auslauf-Trägheit
      if (flyAnim) {
        const tRaw = clamp((nowMs - flyAnim.startTime) / flyAnim.duration, 0, 1);
        const t = tRaw < 0.5 ? 4 * tRaw * tRaw * tRaw : 1 - Math.pow(-2 * tRaw + 2, 3) / 2;
        const targetWorld = geoToWorldLatLon(flyAnim.targetGeoLat, flyAnim.targetGeoLon);
        const dLon = shortestLonDelta(flyAnim.startWorldLon, targetWorld.lon);
        camLat = clamp(flyAnim.startLat + (targetWorld.lat - flyAnim.startLat) * t, -89.5, 89.5);
        camWorldLon = wrapLon(flyAnim.startWorldLon + dLon * t);
        camDist = flyAnim.startDist + (flyAnim.targetDist - flyAnim.startDist) * t;
        if (tRaw >= 1) flyAnim = null;
      } else if (pointers.size === 0 && (Math.abs(velLat) > 0.002 || Math.abs(velLon) > 0.002)) {
        camWorldLon = wrapLon(camWorldLon + velLon);
        camLat = clamp(camLat + velLat, -89.5, 89.5);
        const decay = Math.pow(0.91, dt * 60);
        velLon *= decay;
        velLat *= decay;
      }

      // Kamera und Erdrota-Matrizen vor Kachel-Abfrage, Render & Punkt-Projektion synchronisieren
      // Bei weiter Übersicht leicht nach oben versetzen, damit Kugel, Achse & S-Badge frei über dem Dock stehen
      const dockShift = clamp((camDist - 2.4) / 1.8, 0, 1) * -0.08;
      camera.position.copy(latLonToVec3(camLat, camWorldLon, camDist));
      camera.up.set(0, 1, 0);
      camera.lookAt(0, dockShift, 0);
      earthUniforms.camPos.value.copy(camera.position);
      earthTiltGroup.updateMatrixWorld(true);
      camera.updateMatrixWorld(true);

      // Satellitenkacheln aktualisieren & weich einblenden
      updateSatelliteTiles(nowMs, camDist);
      for (const entry of tileCache.values()) {
        if (entry.state === 'ready' && entry.mesh && entry.mesh.visible && entry.opacity < 1) {
          entry.opacity = Math.min(1, entry.opacity + dt * 5.0);
          entry.mat.uniforms.uOpacity.value = entry.opacity;
        }
      }

      renderer.render(scene, camera);
      updateProjectedOverlays();
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
